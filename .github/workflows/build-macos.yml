name: Build macOS app

# Builds the unsigned macOS .dmg on a GitHub-hosted Mac runner, so you can
# produce a Mac build without owning a Mac. Run it from the Actions tab
# (Run workflow), or push a tag like v1.0.0 to build automatically.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React frontend
        working-directory: app
        run: |
          npm install
          npm run build

      - name: Install Electron deps
        working-directory: mac/electron
        run: npm install

      - name: Build macOS dmg (unsigned)
        working-directory: mac/electron
        env:
          # No Apple Developer cert in CI — skip signing/notarization
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-widget-macos
          path: mac/electron/dist/*.dmg
          if-no-files-found: error
